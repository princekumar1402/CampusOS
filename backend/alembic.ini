# Alembic Configuration for CampusOS
# =====================================
# This file is read by alembic commands.
# The sqlalchemy.url is overridden in alembic/env.py via app settings,
# so the value here is a fallback placeholder.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of slug in file name
truncate_slug_length = 40

# Version path separator (default is os.pathsep)
version_path_separator = os

# Fallback database URL — overridden by env.py
sqlalchemy.url = postgresql://campusOS_user:devpassword@localhost:5432/campusOS_db

[post_write_hooks]
# Automatically format generated migration files
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
